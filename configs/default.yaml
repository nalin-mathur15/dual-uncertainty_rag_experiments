# Experiment Configuration: General-Purpose Interactive RAG under Dual Uncertainty

seed: 42

# HuggingFace public corpora used to build the 500k - 1M+ Dual Uncertainty RAG states
corpora:
  in_distribution_sources:
    - name: "ambig_qa"
      hf_path: "ambig_qa"
      hf_config: "light"
      weight: 0.30
    - name: "hotpot_qa"
      hf_path: "hotpot_qa"
      hf_config: "distractor"
      weight: 0.40
    - name: "ms_marco"
      hf_path: "ms_marco"
      hf_config: "v1.1"
      weight: 0.30
  ood_domain_shift_source:
    name: "scifact"
    hf_path: "allenai/scifact"
    hf_config: "claims"

# Counterfactual 2x2x2 perturbation & VOI parameters
rag_environment:
  num_retrieved_passages: 6          # Top-K retrieved documents per state
  num_candidate_questions: 8         # Candidate clarification questions (disambiguating vs. distractor)
  num_candidate_rewrites: 4          # Candidate search query rewrites / hop expansions
  embedding_dim: 384                 # Dense embedding dimension (e.g., all-MiniLM-L6-v2 / BGE-small)
  passage_feature_dim: 16            # Additional dense/lexical/entailment/contradiction features per passage
  question_cost_lambda: 0.040        # User inconvenience cost \lambda C(q)
  search_cost_gamma: 0.020           # Retrieval latency/compute cost \gamma C(s)
  hallucination_penalty: 0.55        # Cost of generating an answer when evidence is missing/contradictory
  abstain_regret: 0.20               # Baseline regret of safe abstention

# Scale of generated dataset (supports 100k to 1M+ states on the cluster)
splits:
  train_states: 500000               # 500,000 training RAG states (set --scale 2.0 for 1,000,000)
  val_states: 25000                  # 25,000 validation RAG states
  test_id_states: 50000              # 50,000 in-distribution test states
  test_domain_shift_states: 20000    # 20,000 OOD domain-shift states (SciFact / BioMed style)
  test_adversarial_evid_states: 20000 # 20,000 Adversarial contradiction / retrieval failure states

storage:
  text_encoder_model: "sentence-transformers/all-MiniLM-L6-v2"
  data_dir: "data/processed"
  shard_size: 50000

training:
  batch_size: 512
  epochs: 20
  learning_rate: 0.0006
  weight_decay: 0.0001
  hidden_dim: 256
  num_heads: 4
  num_layers: 3
  dropout: 0.1
  ensemble_size: 4
  num_workers: 4
  checkpoint_dir: "outputs/checkpoints"
  results_dir: "outputs/results"
  figures_dir: "outputs/figures"
